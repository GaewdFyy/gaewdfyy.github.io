<!DOCTYPE html>
<html lang="zh">
<head>
  <link rel="stylesheet" type="text&#x2F;css" href="https://cdn.jsdelivr.net/npm/hexo-tag-hint@0.3.1/dist/hexo-tag-hint.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GaewdFyy's Gallery</title>
  <link rel="icon" href="/gallery/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
  <!-- 照片分享卡片（独立样式，仅作用于 .share-card 内） -->
  <link rel="stylesheet" href="./share-card.css">
  <script src="https://cdn.jsdelivr.net/npm/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
  <style>
    /* ── Design tokens ──────────────────────────────────────── */
    :root {
      --primary:           #ffb68a;
      --on-primary:        #4a1f00;
      --primary-container: #6b3000;
      --secondary:         #e8c4a8;
      --surface:           #1a1310;
      --surface-variant:   #2b1f18;
      --on-surface:        #f0e8e0;
      --background:        #130f0c;
      --outline:           #5c4030;
      --outline-variant:   #3e2a1e;
      --t: 0.6s;
      --drawer-w: 260px;
      --drawer-w-collapsed: 76px; /* 折叠后仅留 Logo 的窄条 */
      --sidebar-header-h: 64px;   /* Sidebar Header 固定高度（折叠/展开一致） */
      --sb-motion: 0.36s cubic-bezier(0.2, 0, 0, 1); /* 侧栏折叠/展开统一动效 */
      --header-h: 64px; /* 主内容区顶栏高度（与 Sidebar Header 对齐） */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--background);
      color: var(--on-surface);
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      display: flex; flex-direction: column;
      transition: background var(--t) ease, color var(--t) ease;
      overflow: hidden;         /* .main 自己负责滚动 */
    }

    /* ── Top Toolbar：只属于主内容区，不再横跨侧边栏 ─────────────── */
    .top-bar {
      display: flex; align-items: center; gap: 0.6rem;
      flex: 0 0 var(--header-h); height: var(--header-h);
      padding: 0 1.15rem 0 1.25rem;
      background: var(--surface-variant);
      border-bottom: 1px solid var(--outline-variant);
      position: relative; z-index: 5;
      transition: background var(--t) ease, border-color var(--t) ease;
    }

    /* 当前页标题（全部 / 风景 / 冬天 …，随筛选切换） */
    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400; font-size: 1.32rem; line-height: 1.1;
      color: var(--primary); letter-spacing: 0.01em;
      flex: 1 1 auto; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 主内容列：顶栏 + 可滚动区域 */
    .content { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

    /* 手机端才在顶栏提供侧栏展开按钮 */
    #drawerToggle { display: none; }

    /* 顶栏“返回主站”是链接，跟按钮保持一致 */
    a.icon-btn { text-decoration: none; }
    a.icon-btn:active { background: color-mix(in srgb, var(--on-surface) 12%, transparent); }

    /* 抽屉里的“返回主站”也是链接 */
    a.nav-item { color: inherit; text-decoration: none; }

    /* 手机端：顶栏放侧栏展开按钮，「返回主站」走抽屉入口 */
    @media (max-width: 860px) {
      #backHome { display: none; }
      #drawerToggle { display: flex; }
    }

    /* 窄屏：按钮别把标题挤走 */
    @media (max-width: 480px) {
      .top-bar { gap: 0.3rem; padding: 0 0.6rem; }
      .page-title { font-size: 1.12rem; }
    }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; background: transparent;
      color: var(--on-surface); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color var(--t) ease; flex-shrink: 0;
    }
    .icon-btn:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
    .icon-btn svg { width: 22px; height: 22px; stroke-linecap: round; stroke-linejoin: round; }

    /* 顶栏「返回主站」：图标 + 文字，胶囊按钮（手机端整体隐藏，走抽屉） */
    #backHome {
      width: auto; height: 36px;
      padding: 0 0.85rem 0 0.7rem;
      gap: 0.4rem; border-radius: 99px;
    }
    #backHome svg { width: 17px; height: 17px; opacity: 0.8; }
    #backHome .icon-label { font-size: 0.82rem; letter-spacing: 0.02em; white-space: nowrap; }

    /* 桌面端隐藏抽屉里的返回入口（顶栏已有按钮） */
    @media (min-width: 861px) {
      #backHomeDrawer { display: none; }
    }

    /* ── Shell (drawer + main side by side) ─────────────────── */
    .shell { flex: 1; display: flex; min-height: 0; position: relative; }

    /* ── MD3 Navigation Drawer ──────────────────────────────── */
    .drawer {
      width: var(--drawer-w); flex-shrink: 0;
      display: flex; flex-direction: column;
      background: var(--surface-variant);
      border-right: 1px solid var(--outline-variant);
      overflow: hidden;
      transition: width var(--sb-motion), background var(--t) ease, border-color var(--t) ease;
    }
    /* 侧栏内容独立滚动，Sidebar Header 永远钉在顶部 */
    .drawer-nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
    .drawer::-webkit-scrollbar, .drawer-nav::-webkit-scrollbar { display: none; }

    /* ── Sidebar Header（属于 Sidebar 本身，与全局 Top Toolbar 相互独立） ── */
    .sidebar-header {
      height: var(--sidebar-header-h); flex: 0 0 var(--sidebar-header-h);
      display: flex; align-items: center; gap: 0.55rem;
      padding: 0 0.85rem 0 0.95rem;
      background: color-mix(in srgb, var(--surface) 45%, var(--surface-variant));
      border-bottom: 1px solid var(--outline-variant);
      position: relative; z-index: 2;
      transition: padding var(--sb-motion), gap var(--sb-motion),
                  background var(--t) ease, border-color var(--t) ease;
    }

    /* Logo：展开态静态展示；折叠态悬停/聚焦时交叉淡出为「展开」箭头 */
    .sidebar-logo {
      position: relative; flex-shrink: 0;
      width: 36px; height: 36px; padding: 0;
      display: grid; place-items: center;
      border: none; border-radius: 12px; background: transparent;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
    }
    /* 应用 Logo（Material Symbols photo_library，跟随主题色） */
    .sidebar-logo .logo-mark {
      width: 26px; height: 26px; display: block;
      color: color-mix(in srgb, var(--on-surface) 90%, transparent);
      transition: opacity 0.2s ease, transform 0.25s ease, color var(--t) ease;
    }
    .sidebar-logo .logo-hint {
      position: absolute; inset: 0; display: grid; place-items: center;
      opacity: 0; transform: scale(0.75); color: var(--primary);
      transition: opacity 0.2s ease, transform 0.25s ease;
    }
    .sidebar-logo .logo-hint svg { width: 20px; height: 20px; }

    /* 标题 + 副标题：合并进 Sidebar Header，位于 Logo 右侧 */
    .sidebar-titles {
      display: flex; flex-direction: column; justify-content: center;
      gap: 0.12rem; min-width: 0; flex: 1 1 auto;
      transition: opacity 0.18s ease, visibility 0.18s,
                  width var(--sb-motion), margin var(--sb-motion);
    }
    .sidebar-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400; font-size: 1.05rem; line-height: 1.1;
      color: var(--on-surface); letter-spacing: 0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar-subtitle {
      font-size: 0.62rem; line-height: 1.1;
      letter-spacing: 0.12em;
      color: var(--secondary); opacity: 0.75;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .sidebar-collapse {
      margin-left: auto; flex-shrink: 0;
      width: 36px; height: 36px; padding: 0; border-radius: 50%;
      display: grid; place-items: center;
      border: none; background: transparent; cursor: pointer;
      color: color-mix(in srgb, var(--on-surface) 70%, transparent);
      transition: background 0.2s ease, color 0.2s ease,
                  width var(--sb-motion), margin var(--sb-motion),
                  opacity 0.18s ease, transform var(--sb-motion);
    }
    .sidebar-collapse:hover  { background: color-mix(in srgb, var(--on-surface) 10%, transparent); color: var(--on-surface); }
    .sidebar-collapse:active { background: color-mix(in srgb, var(--on-surface) 16%, transparent); }
    .sidebar-collapse svg { width: 20px; height: 20px; }

    .drawer-section-label {
      font-size: 0.58rem; letter-spacing: 0.2em;
      text-transform: uppercase; opacity: 0.45;
      padding: 0.9rem 1.5rem 0.35rem;
      transition: opacity 0.18s ease, visibility 0.18s;
    }

    /* nav item (pill) */
    .nav-item {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.7rem 1rem 0.7rem 1.1rem;
      margin: 0.08rem 0.65rem;
      border-radius: 99px; cursor: pointer;
      transition: background 0.18s, color 0.18s,
                  padding var(--sb-motion), margin var(--sb-motion);
      user-select: none; position: relative;
    }
    .nav-item:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
    .nav-item.active { background: var(--primary-container); color: var(--on-primary-container); }

    .nav-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.65; transition: opacity 0.18s; }
    .nav-item.active .nav-icon { opacity: 1; }
    .nav-label { font-size: 0.84rem; flex: 1; transition: opacity 0.18s ease, visibility 0.18s; }
    .nav-count {
      font-size: 0.65rem; opacity: 0.6;
      background: color-mix(in srgb, var(--on-surface) 8%, transparent);
      padding: 0.08rem 0.48rem; border-radius: 99px;
      transition: opacity 0.18s ease, visibility 0.18s, background 0.18s;
    }
    .nav-item.active .nav-count { opacity: 0.8; background: color-mix(in srgb, var(--on-primary-container) 12%, transparent); }

    /* sub-list */
    .nav-sub { overflow: hidden; max-height: 0; transition: max-height 0.28s ease, opacity 0.18s ease, visibility 0.18s; }
    .nav-sub.open { max-height: 600px; }

    .nav-sub-item {
      display: flex; align-items: center; gap: 0.55rem;
      padding: 0.38rem 1rem 0.38rem 3rem;
      margin: 0 0.65rem; border-radius: 99px;
      font-size: 0.72rem; opacity: 0.55;
      cursor: pointer; transition: opacity 0.15s, background 0.15s;
    }
    .nav-sub-item:hover { opacity: 0.9; background: color-mix(in srgb, var(--on-surface) 6%, transparent); }
    .nav-sub-item.tl-active { opacity: 1; color: var(--primary); }
    .nav-sub-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: currentColor; flex-shrink: 0; transition: transform 0.15s;
    }
    .nav-sub-item.tl-active .nav-sub-dot { transform: scale(1.7); }

    /* ── Drawer Footer (版权署名) ───────────────────────────── */
    .drawer-footer {
      padding: 1.2rem 1.5rem 1.5rem;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      opacity: 0.35;
      text-align: center;
      flex-shrink: 0;
      transition: opacity 0.18s ease, visibility 0.18s, padding var(--sb-motion), height var(--sb-motion);
    }

    /* ── 折叠态（桌面/宽屏）：只保留 Logo 的窄条 ────────────── */
    @media (min-width: 861px) {
      body[data-sidebar="collapsed"] .drawer { width: var(--drawer-w-collapsed); }
      body[data-sidebar="collapsed"] .sidebar-header {
        justify-content: center; gap: 0; padding: 0;
      }
      body[data-sidebar="collapsed"] .sidebar-collapse {
        width: 0; margin-left: 0; opacity: 0;
        transform: translateX(8px); pointer-events: none;
      }
      body[data-sidebar="collapsed"] .sidebar-logo {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      /* 悬停（鼠标设备）时 Logo 交叉淡出为展开箭头 */
      @media (hover: hover) {
        body[data-sidebar="collapsed"] .sidebar-logo:hover,
        body[data-sidebar="collapsed"] .sidebar-header:hover .sidebar-logo {
          background: color-mix(in srgb, var(--on-surface) 8%, transparent);
        }
        body[data-sidebar="collapsed"] .sidebar-logo:hover .logo-mark,
        body[data-sidebar="collapsed"] .sidebar-header:hover .sidebar-logo .logo-mark {
          opacity: 0; transform: scale(0.8) rotate(-10deg);
        }
        body[data-sidebar="collapsed"] .sidebar-logo:hover .logo-hint,
        body[data-sidebar="collapsed"] .sidebar-header:hover .sidebar-logo .logo-hint {
          opacity: 1; transform: none;
        }
      }
      /* 键盘聚焦时同样呈现展开箭头 */
      body[data-sidebar="collapsed"] .sidebar-logo:focus-visible {
        background: color-mix(in srgb, var(--on-surface) 8%, transparent);
      }
      body[data-sidebar="collapsed"] .sidebar-logo:focus-visible .logo-mark { opacity: 0; transform: scale(0.8); }
      body[data-sidebar="collapsed"] .sidebar-logo:focus-visible .logo-hint { opacity: 1; transform: none; }

      /* 折叠态下标题/副标题让位，Header 只留 Logo */
      body[data-sidebar="collapsed"] .sidebar-titles {
        flex: 0 0 0; width: 0; margin: 0; overflow: hidden;
        opacity: 0; visibility: hidden;
      }

      body[data-sidebar="collapsed"] .drawer-section-label {
        opacity: 0; visibility: hidden;
        height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden;
      }
      /* 文字让出空间，图标才能居中（visibility 隐藏后仍占位，需收窄） */
      body[data-sidebar="collapsed"] .nav-label {
        flex: 0 0 0; width: 0; overflow: hidden;
        opacity: 0; visibility: hidden;
      }
      body[data-sidebar="collapsed"] .nav-count {
        display: none;
      }
      body[data-sidebar="collapsed"] .nav-sub {
        opacity: 0; visibility: hidden; max-height: 0; pointer-events: none;
      }
      body[data-sidebar="collapsed"] .drawer-footer {
        opacity: 0; visibility: hidden;
        height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden;
      }
      body[data-sidebar="collapsed"] .nav-item {
        justify-content: center; gap: 0;
        padding-left: 0; padding-right: 0;
        margin-left: 0.55rem; margin-right: 0.55rem;
      }
      body[data-sidebar="collapsed"] .nav-icon { opacity: 0.75; }
    }

    /* ── Scrim (mobile) ─────────────────────────────────────── */
    .scrim {
      display: none; position: fixed; inset: 0; z-index: 298;
      background: rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none; transition: opacity 0.28s ease;
    }

    /* ── 键盘可访问性：统一焦点环 ───────────────────────────── */
    .sidebar-logo:focus-visible,
    .sidebar-collapse:focus-visible,
    .nav-item:focus-visible,
    .nav-sub-item:focus-visible {
      outline: 2px solid var(--primary); outline-offset: 2px;
    }
    .nav-item:focus-visible { background: color-mix(in srgb, var(--on-surface) 10%, transparent); }

    /* ── Main scroll area ───────────────────────────────────── */
    .main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; min-width: 0; }

    /* ── Gallery ────────────────────────────────────────────── */
    .gallery-wrap { padding: 2.5rem 2.5rem 5rem; }
    .month-group { margin-bottom: 0.5rem; scroll-margin-top: 16px; }
    .month-group.empty { display: none; }
    .month-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem; font-weight: 600; font-style: italic;
      color: var(--secondary); opacity: 0.7;
      margin-bottom: 0.9rem; padding-left: 2px;
    }

    /* ── Masonry grid ───────────────────────────────────────── */
    .grid { position: relative; }
    .grid-sizer, .gallery-item { width: calc(25% - 12px); }
    .gutter-sizer { width: 16px; }

    .gallery-item {
      margin-bottom: 16px; cursor: pointer;
      position: relative; overflow: hidden; border-radius: 10px;
      opacity: 0; animation: rise 0.5s ease forwards;
    }
    @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    .gallery-item img { width: 100%; display: block; border-radius: 10px; transition: transform 0.5s ease; }
    .gallery-item:hover img { transform: scale(1.05); }

    .item-hover-caption {
      position: absolute; inset: 0; border-radius: 10px;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 1rem 0.9rem 0.85rem;
      background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.14) 55%, transparent 100%);
      opacity: 0; transition: opacity 0.28s ease; pointer-events: none;
    }
    .gallery-item:hover .item-hover-caption { opacity: 1; }
    .caption-en {
      font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
      font-size: 1.62rem; color: #fff; line-height: 1.2;
      text-shadow: 0 1px 5px rgba(0,0,0,0.55);
    }
    .caption-zh {
      font-size: 1.0rem; letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.8); margin-top: 0.2rem;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* ── Empty state ────────────────────────────────────────── */
    .empty-state {
      display: none; flex-direction: column;
      align-items: center; padding: 6rem 2rem;
      opacity: 0.4; gap: 0.8rem;
    }
    .empty-state.show { display: flex; }
    .empty-state svg { width: 44px; }
    .empty-state p { font-size: 0.82rem; letter-spacing: 0.1em; }

    /* ── Detail overlay ─────────────────────────────────────── */
    .detail-overlay {
      position: fixed; inset: 0; z-index: 400;
      display: flex; align-items: stretch;
      opacity: 0; pointer-events: none; transition: opacity 0.32s ease;
    }
    .detail-overlay.open { opacity: 1; pointer-events: all; }
    .detail-backdrop { 
      position: absolute; inset: 0; 
      background: color-mix(in srgb, var(--background) 85%, transparent); 
      backdrop-filter: blur(10px); 
      transition: background var(--t) ease;
    }

    .detail-panel {
      position: relative; z-index: 1; display: flex;
      width: 100%; max-width: 1200px; margin: auto;
      height: 88vh; border-radius: 16px; overflow: hidden;
      background: var(--surface); border: 1px solid var(--outline-variant);
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
      transform: translateY(20px) scale(0.975);
      transition: transform 0.36s cubic-bezier(0.22,1,0.36,1), background var(--t) ease, border-color var(--t) ease;
    }
    .detail-overlay.open .detail-panel { transform: none; }

    .detail-img-wrap { flex: 1 1 60%; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .detail-img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .detail-meta {
      flex: 0 0 320px; display: flex; flex-direction: column;
      padding: 2.5rem 1.8rem; border-left: 1px solid var(--outline-variant);
      overflow-y: auto; background: var(--surface-variant);
      transition: background var(--t) ease, border-color var(--t) ease;
    }
    .detail-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 1.85rem; margin-bottom: 0.35rem; color: var(--on-surface); }
    .detail-loc   { font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--secondary); margin-bottom: 0.5rem; }
    .detail-date  { font-size: 0.65rem; opacity: 0.45; margin-bottom: 1.5rem; }
    .detail-tag-row { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 1.6rem; }
    .detail-tag-chip { font-size: 0.6rem; letter-spacing: 0.07em; padding: 0.18rem 0.6rem; border-radius: 99px; border: 1px solid var(--outline); color: var(--primary); background: var(--primary-container); }
    .detail-params { display: grid; grid-template-columns: auto 1fr; gap: 0.55rem 1.1rem; margin-bottom: 1.8rem; }
    .param-key { font-size: 0.62rem; text-transform: uppercase; opacity: 0.5; }
    .param-val  { font-size: 0.8rem; }
    .detail-comment { font-size: 0.83rem; line-height: 1.78; opacity: 0.8; border-left: 2px solid var(--primary); padding-left: 0.85rem; margin-bottom: 2.5rem; }
    /* 详情页底部操作区：分享 + 获取高清原图 并排 */
    .detail-actions {
      margin-top: auto;
      display: flex; align-items: stretch; gap: 0.5rem;
    }
    .btn-raw {
      flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
      padding: 0.75rem; border-radius: 8px;
      background: var(--primary-container); color: var(--on-primary-container);
      text-decoration: none; font-size: 0.72rem; letter-spacing: 0.1em;
      text-transform: uppercase; border: 1px solid var(--outline); transition: all 0.2s ease;
    }
    .btn-raw:hover { background: var(--primary); color: var(--on-primary); transform: translateY(-2px); }
    /* 「分享」：次要操作，描边样式，置于「获取高清原图」左侧 */
    .btn-share {
      flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
      gap: 0.38rem; padding: 0.75rem 0.9rem; border-radius: 8px;
      background: transparent; color: var(--primary);
      border: 1px solid var(--outline);
      font-family: inherit; font-size: 0.72rem; letter-spacing: 0.1em;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn-share svg { width: 15px; height: 15px; flex-shrink: 0; }
    .btn-share:hover { background: var(--primary-container); color: var(--on-primary-container); transform: translateY(-2px); }
    .btn-share:active { transform: translateY(0); }
    .btn-share:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .detail-close {
      position: absolute; top: 0.9rem; right: 0.9rem; z-index: 10;
      width: 34px; height: 34px; border-radius: 50%;
      background: color-mix(in srgb, var(--on-surface) 10%, transparent); border: none;
      color: var(--on-surface); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
      transition: background 0.2s, color var(--t) ease;
    }
    .detail-close:hover { background: color-mix(in srgb, var(--on-surface) 20%, transparent); }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 1200px) {
      .grid-sizer, .gallery-item { width: calc(33.333% - 11px); }
    }
    @media (max-width: 860px) {
      /* drawer 弹出层：从窗口顶部开始，覆盖整屏高度（不叠在顶栏下面） */
      .drawer {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 299;
        height: 100%;
        transform: translateX(calc(-1 * var(--drawer-w) - 8px));
        transition: transform 0.3s cubic-bezier(0.2,0,0,1), background var(--t) ease;
        box-shadow: none; border-right: 1px solid var(--outline-variant);
      }
      .drawer.open {
        transform: translateX(0);
        box-shadow: 8px 0 32px rgba(0,0,0,0.55);
      }
      .scrim { display: block; }
      .scrim.show { opacity: 1; pointer-events: all; }

      /* 触摸端放大 Sidebar Header 内的点按热区 */
      .sidebar-logo, .sidebar-collapse { width: 44px; height: 44px; }
      .sidebar-header { padding: 0 0.6rem 0 0.7rem; gap: 0.45rem; }
      .sidebar-title { font-size: 0.95rem; }
      .sidebar-subtitle { font-size: 0.58rem; letter-spacing: 0.1em; }

      .gallery-wrap { padding: 1.8rem 1.25rem 4rem; }
      
      .detail-overlay { align-items: flex-end; }
      .detail-panel {
        flex-direction: column; width: 100%; max-width: 100%; height: 92dvh;
        border-radius: 20px 20px 0 0; margin: 0; transform: translateY(40px);
      }
      .detail-overlay.open .detail-panel { transform: translateY(0); }
      .detail-img-wrap { flex: 0 0 42%; min-height: 0; }
      .detail-meta {
        flex: 1 1 0; min-height: 0; border-left: none;
        border-top: 1px solid var(--outline-variant);
        padding: 1.4rem 1.5rem 2rem; overflow-y: auto;
      }
      .detail-title { font-size: 1.45rem; margin-bottom: 0.5rem; }
      .detail-loc  { margin-bottom: 0.45rem; }
      .detail-date { margin-bottom: 1rem; }
      .detail-tag-row { margin-bottom: 1.1rem; }
      .detail-params  { margin-bottom: 1.2rem; }
      .detail-comment { margin-bottom: 1.6rem; }
      .detail-close { top: 0.75rem; right: 0.75rem; background: rgba(0,0,0,0.45); backdrop-filter: blur(8px); color: #fff; }

      /* ── 移动端：滚动至中心自动聚焦动画 ── */
      .gallery-item.is-focused .item-hover-caption { opacity: 1; }
      .gallery-item.is-focused img { transform: scale(1.05); }
      
      /* 取消移动端点按导致的永久悬停残留 */
      @media (hover: none) {
        .gallery-item:hover .item-hover-caption { opacity: 0; }
        .gallery-item:hover img { transform: none; }
        .gallery-item.is-focused .item-hover-caption { opacity: 1; }
        .gallery-item.is-focused img { transform: scale(1.03); }
      }
    }
    @media (max-width: 640px) {
      .grid-sizer, .gallery-item { width: calc(50% - 8px); }
    }
    @media (max-width: 420px) {
      .grid-sizer, .gallery-item { width: 100%; margin-bottom: 10px; }

    /* ── 尊重「减少动态效果」偏好 ────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .drawer, .sidebar-header, .sidebar-logo, .sidebar-collapse,
      .nav-item, .nav-label, .nav-count, .sidebar-titles, .sidebar-title, .sidebar-subtitle,
      .drawer-section-label, .drawer-footer, .nav-sub,

        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

<div class="shell">

      <h1 class="page-title" id="pageTitle">全部</h1>

      <a class="icon-btn" id="backHome" href="/" title="返回主站" aria-label="返回主站">
        <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>

            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>

<div class="detail-overlay" id="detailOverlay">

        <button class="btn-share" id="btnShare" type="button" aria-haspopup="dialog" title="生成分享卡片">
          <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="8.7" y1="10.6" x2="15.3" y2="6.4"/>
            <line x1="8.7" y1="13.4" x2="15.3" y2="17.6"/>
          </svg>

<script type="module">
import { argbFromRgb, themeFromSourceColor, hexFromArgb }
  from 'https://esm.sh/@material/material-color-utilities@0.3.0';
import { initShareCard } from './share-card.js';

/* ── 照片数据 ────────────────────────────────────────────────
   数据来源：source/_data/gallery.yml
   构建时由 scripts/gallery-data.js 生成 /gallery/photos.json
   加图只改那个 yml，不用动这个文件
   ──────────────────────────────────────────────────────────── */
let PHOTOS = [];
try {
  const res = await fetch('/gallery/photos.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  PHOTOS = await res.json();
} catch (err) {
  console.error('[gallery] 照片列表加载失败：', err);
}

/* ── Theme Management ─────────────────────────────────────── */
const root = document.documentElement;
const colorCache = new Map();

const prefersDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');
let isDarkMode = localStorage.getItem('md3-theme') 
  ? localStorage.getItem('md3-theme') === 'dark' 
  : prefersDarkQuery.matches;
const DEFAULT_BASE_COLOR = [249, 202, 163];   // 取色失败时的兜底色
let currentBaseColor = [...DEFAULT_BASE_COLOR];

const themeToggleBtn = document.getElementById('themeToggle');

function updateThemeIcon() {
  themeToggleBtn.innerHTML = isDarkMode
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
}

function applyTheme(r, g, b, dark = isDarkMode) {
  currentBaseColor = [r, g, b];
  const s = themeFromSourceColor(argbFromRgb(r, g, b)).schemes[dark ? 'dark' : 'light'];
  const vars = {
    '--primary':              hexFromArgb(s.primary),
    '--on-primary':           hexFromArgb(s.onPrimary),
    '--primary-container':    hexFromArgb(s.primaryContainer),
    '--on-primary-container': hexFromArgb(s.onPrimaryContainer),
    '--secondary':            hexFromArgb(s.secondary),
    '--surface':              hexFromArgb(s.surface),
    '--surface-variant':      hexFromArgb(s.surfaceVariant),
    '--on-surface':           hexFromArgb(s.onSurface),
    '--outline':              hexFromArgb(s.outline),
    '--outline-variant':      hexFromArgb(s.outlineVariant),
    '--background':           hexFromArgb(s.background),
  };
  for (const [k, v] of Object.entries(vars)) root.style.setProperty(k, v);
}

themeToggleBtn.addEventListener('click', () => {
  isDarkMode = !isDarkMode;
  localStorage.setItem('md3-theme', isDarkMode ? 'dark' : 'light');
  updateThemeIcon();
  applyTheme(...currentBaseColor);
});

prefersDarkQuery.addEventListener('change', (e) => {
  if (!localStorage.getItem('md3-theme')) {
    isDarkMode = e.matches;
    updateThemeIcon();
    applyTheme(...currentBaseColor);
  }
});

/* ── 首屏动态主题：用「最新上传」的照片取色 ─────────────────
   打开详情时仍然随图变色，这里只负责首屏的基准色。
   ──────────────────────────────────────────────────────────── */
const THEME_BASE_KEY = 'gallery-theme-base';

/* 缩略取样：绘制到 80×80 画布后取平均色（详情弹窗与首屏共用） */
function averageColorOf(source, w = 80, h = 80) {
  return createImageBitmap(source, { resizeWidth: w, resizeHeight: h, resizeQuality: 'low' })
    .then((bitmap) => {
      const oc  = new OffscreenCanvas(w, h);
      const ctx = oc.getContext('2d');
      ctx.drawImage(bitmap, 0, 0);
      bitmap.close();
      const data = ctx.getImageData(0, 0, w, h).data;
      let r = 0, g = 0, b = 0, count = 0;
      for (let i = 0; i < data.length; i += 16) {
        if (data[i + 3] < 128) continue;
        r += data[i]; g += data[i + 1]; b += data[i + 2];
        count++;
      }
      return count ? [Math.round(r / count), Math.round(g / count), Math.round(b / count)] : null;
    });
}

/* 最新上传 = gallery.yml 里最后加入的那一条（构建时写入 added 序号） */
function latestUploadedPhoto() {
  if (!PHOTOS.length) return null;
  const scored = PHOTOS.filter((p) => Number.isFinite(p.added));
  if (!scored.length) return PHOTOS[0];
  return scored.reduce((a, b) => (b.added > a.added ? b : a));
}

async function applyThemeFromLatestUpload() {
  const photo = latestUploadedPhoto();
  if (!photo) return;
  if (colorCache.has(photo.src)) { applyTheme(...colorCache.get(photo.src)); return; }
  try {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.decoding = 'async';
    img.src = photo.src;
    if (img.decode) await img.decode();
    else await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
    const color = await averageColorOf(img);
    if (!color) return;
    colorCache.set(photo.src, color);
    applyTheme(...color);
    try { localStorage.setItem(THEME_BASE_KEY, JSON.stringify(color)); } catch (e) {}
  } catch (e) {
    console.warn('[gallery] 首屏取色失败，保持默认色板：', e);
  }
}

/* 上次算好的基准色先顶上，避免首屏先闪一下默认色 */
try {
  const saved = JSON.parse(localStorage.getItem(THEME_BASE_KEY) || 'null');
  if (Array.isArray(saved) && saved.length === 3) currentBaseColor = saved;
} catch (e) {}

updateThemeIcon();
applyTheme(...currentBaseColor);
applyThemeFromLatestUpload();

/* ── Date / group helpers ─────────────────────────────────── */
const MONTHS_ZH = ['一月','二月','三月','四月','五月','六月',
                   '七月','八月','九月','十月','十一月','十二月'];

const parseDate  = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const groupKey   = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const groupLabel = k => { const [y,m] = k.split('-'); return `${y} · ${MONTHS_ZH[+m-1]}`; };
const anchor     = k => `grp-${k}`;

/* ── Derive data structures ───────────────────────────────── */
PHOTOS.sort((a, b) => parseDate(b.date) - parseDate(a.date));

const allTags = [...new Set(PHOTOS.flatMap(p => p.tags))];
const groups = new Map();
PHOTOS.forEach(p => {
  const k = groupKey(parseDate(p.date));
  if (!groups.has(k)) groups.set(k, []);
  groups.get(k).push(p);
});

/* ── State ────────────────────────────────────────────────── */
let activeTag = '全部';

/* ── 页面标题（顶栏显示当前筛选页，如 全部 / 风景 / 冬天） ────── */
const pageTitleEl = document.getElementById('pageTitle');
const SITE_TITLE  = "GaewdFyy's Gallery";
function updatePageTitle() {
  pageTitleEl.textContent = activeTag;
  document.title = activeTag === '全部' ? SITE_TITLE : `${activeTag} · ${SITE_TITLE}`;
}

/* ── Nav Build ────────────────────────────────────────────── */
const ICON_ALL = `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
  <rect x="3" y="3" width="7" height="7" rx="1.5"/>
  <rect x="14" y="3" width="7" height="7" rx="1.5"/>
  <rect x="3" y="14" width="7" height="7" rx="1.5"/>
  <rect x="14" y="14" width="7" height="7" rx="1.5"/>
</svg>`;
const ICON_TAG = `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
  <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
  <line x1="7" y1="7" x2="7.01" y2="7"/>
</svg>`;

function buildNav() {
  const list = document.getElementById('navList');
  list.innerHTML = '';
  appendNavItem(list, '全部', ICON_ALL, PHOTOS.length);
  allTags.forEach(tag => {
    appendNavItem(list, tag, ICON_TAG, PHOTOS.filter(p => p.tags.includes(tag)).length);
  });
  syncNavActive();
}

function appendNavItem(list, tag, icon, count) {
  const item = document.createElement('div');
  item.className = 'nav-item';
  item.dataset.tag = tag;
  item.tabIndex = 0;
  item.setAttribute('role', 'button');
  item.setAttribute('aria-label', tag);   // 折叠成图标栏后仍有可读名称
  item.setAttribute('aria-pressed', 'false');
  item.innerHTML = `${icon}<span class="nav-label">${tag}</span><span class="nav-count">${count}</span>`;
  item.addEventListener('click', () => { selectTag(tag); closeMobileDrawer(); });
  item.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      selectTag(tag);
      closeMobileDrawer();
    }
  });

  const sub = document.createElement('div');
  sub.className = 'nav-sub';
  sub.dataset.tag = tag;
  rebuildSubItems(sub, tag);

  list.appendChild(item);
  list.appendChild(sub);
}

function rebuildSubItems(container, tag) {
  container.innerHTML = '';
  groups.forEach((photos, key) => {
    if (tag !== '全部' && !photos.some(p => p.tags.includes(tag))) return;
    const [y, m] = key.split('-');
    const row = document.createElement('div');
    row.className = 'nav-sub-item';
    row.dataset.key = key;
    row.tabIndex = 0;
    row.setAttribute('role', 'button');
    row.innerHTML = `<div class="nav-sub-dot"></div>${y} ${MONTHS_ZH[+m-1]}`;
    row.addEventListener('click', e => { e.stopPropagation(); scrollToGroup(key); closeMobileDrawer(); });
    row.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        scrollToGroup(key);
        closeMobileDrawer();
      }
    });
    container.appendChild(row);
  });
}

function syncNavActive() {
  document.querySelectorAll('.nav-item').forEach(el => {
    const on = el.dataset.tag === activeTag;
    el.classList.toggle('active', on);
    if (el.dataset.tag) el.setAttribute('aria-pressed', String(on));
  });
  document.querySelectorAll('.nav-sub').forEach(el =>
    el.classList.toggle('open', el.dataset.tag === activeTag));
}

function selectTag(tag) {
  activeTag = tag;
  syncNavActive();
  renderGallery();
  updatePageTitle();
}

/* ── Gallery Render ───────────────────────────────────────── */
const galleryRoot = document.getElementById('galleryRoot');

function renderGallery() {
  galleryRoot.innerHTML = '';
  let anyVisible = false;

  groups.forEach((photos, key) => {
    const visible = activeTag === '全部'
      ? photos
      : photos.filter(p => p.tags.includes(activeTag));

    if (!visible.length) return;
    anyVisible = true;

    const section = document.createElement('div');
    section.className = 'month-group';
    section.id = anchor(key);

    const heading = document.createElement('div');
    heading.className = 'month-heading';
    heading.textContent = groupLabel(key);
    section.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.innerHTML = '<div class="grid-sizer"></div><div class="gutter-sizer"></div>';

    visible.forEach(p => {
      const item = document.createElement('div');
      item.className = 'gallery-item';

      const img = document.createElement('img');
      img.src = p.src; img.alt = p.title; img.crossOrigin = 'anonymous'; img.loading = 'lazy';

      const cap = document.createElement('div');
      cap.className = 'item-hover-caption';
      cap.innerHTML = `<span class="caption-en">${p.title}</span><span class="caption-zh">${p.loc}</span>`;

      item.appendChild(img);
      item.appendChild(cap);
      item.addEventListener('click', () => openDetail(p, img));
      grid.appendChild(item);
    });

    section.appendChild(grid);
    galleryRoot.appendChild(section);

    imagesLoaded(grid, () => {
      new Masonry(grid, {
        itemSelector: '.gallery-item',
        columnWidth:  '.grid-sizer',
        gutter:       '.gutter-sizer',
        percentPosition: true,
      });
      updateSubActive();
      updateScrollObserver(); // 移动端滚动聚焦重新绑定
    });
  });

  document.getElementById('emptyState').classList.toggle('show', !anyVisible);
  updateSubActive();
}

/* ══════════════════════════════════════════════════════════════
   MOBILE SCROLL OBSERVER (移动端中心视野自动聚焦)
══════════════════════════════════════════════════════════════ */
let scrollObserver = null;

function updateScrollObserver() {
  if (scrollObserver) {
    scrollObserver.disconnect();
    scrollObserver = null;
  }
  
  // 仅在窄屏（移动端）设备上激活
  if (window.innerWidth > 860) return;

  // 设定触发区域：屏幕正中间的 40% 区域 
  // (即顶部裁掉 30%，底部裁掉 30% 留下的中间横带)
  const options = {
    root: null,
    rootMargin: '-30% 0px -30% 0px',
    threshold: 0
  };

  scrollObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      // 当图片进入屏幕中央区域时，加上 is-focused 类
      if (entry.isIntersecting) {
        entry.target.classList.add('is-focused');
      } else {
        entry.target.classList.remove('is-focused');
      }
    });
  }, options);

  // 监听当前所有的画廊图片
  document.querySelectorAll('.gallery-item').forEach(item => {
    scrollObserver.observe(item);
  });
}

// 监听屏幕旋转或缩放，动态开启/关闭观察器
window.addEventListener('resize', updateScrollObserver, { passive: true });


/* ── Scroll Tracking ──────────────────────────────────────── */
function scrollToGroup(key) {
  const el = document.getElementById(anchor(key));
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function updateSubActive() {
  const main = document.getElementById('main');
  const threshold = main.getBoundingClientRect().top + 100;
  const sections  = [...document.querySelectorAll('.month-group')];
  if (!sections.length) return;

  let activeKey = sections[0].id.replace('grp-', '');
  sections.forEach(s => {
    if (s.getBoundingClientRect().top <= threshold) activeKey = s.id.replace('grp-', '');
  });

  document.querySelectorAll('.nav-sub-item').forEach(el =>
    el.classList.toggle('tl-active', el.dataset.key === activeKey));
}

document.getElementById('main').addEventListener('scroll', updateSubActive, { passive: true });
window.addEventListener('scroll', updateSubActive, { passive: true });

/* ── Sidebar：Sidebar Header 折叠/展开 + 移动端抽屉 ────────── */
const drawer     = document.getElementById('drawer');
const scrim      = document.getElementById('scrim');
const sbLogo     = document.getElementById('sidebarLogo');
const sbCollapse = document.getElementById('sidebarCollapse');
const drawerToggle = document.getElementById('drawerToggle');
const SIDEBAR_KEY = 'gallery-sidebar-collapsed';
const isMobile    = () => window.innerWidth <= 860;

/* 折叠/展开按钮的焦点与读屏状态随断点/状态同步 */
function syncSidebarA11y() {
  if (isMobile()) {
    sbLogo.tabIndex = -1;
    sbLogo.setAttribute('aria-hidden', 'true');
    sbLogo.setAttribute('aria-expanded', 'true');
    sbCollapse.tabIndex = 0;
    sbCollapse.removeAttribute('aria-hidden');
    sbCollapse.setAttribute('aria-label', '关闭导航');
    sbCollapse.setAttribute('aria-expanded', String(drawer.classList.contains('open')));
    return;
  }
  const collapsed = document.body.dataset.sidebar === 'collapsed';
  sbLogo.tabIndex = collapsed ? 0 : -1;
  sbLogo.setAttribute('aria-label', '展开侧边栏');
  sbLogo.setAttribute('aria-expanded', String(!collapsed));
  if (collapsed) sbLogo.removeAttribute('aria-hidden');
  else sbLogo.setAttribute('aria-hidden', 'true');

  sbCollapse.tabIndex = collapsed ? -1 : 0;
  sbCollapse.setAttribute('aria-label', '收起侧边栏');
  sbCollapse.setAttribute('aria-expanded', String(!collapsed));
  if (collapsed) sbCollapse.setAttribute('aria-hidden', 'true');
  else sbCollapse.removeAttribute('aria-hidden');
}

/* 桌面端：折叠 / 展开（记住偏好） */
function setSidebarCollapsed(collapsed) {
  document.body.dataset.sidebar = collapsed ? 'collapsed' : 'expanded';
  if (collapsed) localStorage.setItem(SIDEBAR_KEY, '1');
  else localStorage.removeItem(SIDEBAR_KEY);
  syncSidebarA11y();
}

/* 移动端：侧栏抽屉开 / 合 */
function setDrawerOpen(open) {
  if (!isMobile()) return;
  drawer.classList.toggle('open', open);
  scrim.classList.toggle('show', open);
  document.body.dataset.drawer = open ? 'open' : 'closed';
  drawer.inert = !open;               // 关闭时移出焦点顺序
  drawerToggle.setAttribute('aria-expanded', String(open));
  syncSidebarA11y();
}

function openMobileDrawer() {
  setDrawerOpen(true);
  sbCollapse.focus({ preventScroll: true });
}

function closeMobileDrawer() {
  const wasOpen = drawer.classList.contains('open');
  setDrawerOpen(false);
  if (wasOpen && drawer.contains(document.activeElement)) drawerToggle.focus({ preventScroll: true });
}

/* 交互：收起按钮在桌面折叠侧栏，在移动端关闭抽屉 */
sbCollapse.addEventListener('click', () => {
  if (isMobile()) { closeMobileDrawer(); return; }
  setSidebarCollapsed(true);
  sbLogo.focus({ preventScroll: true });   // 键盘焦点留在侧栏内
});

/* 折叠态下 Logo 即「展开」按钮（悬停已有交叉淡入提示） */
sbLogo.addEventListener('click', () => {
  if (isMobile() || document.body.dataset.sidebar !== 'collapsed') return;
  setSidebarCollapsed(false);
  sbCollapse.focus({ preventScroll: true });
});

/* 移动端：顶栏的侧栏展开按钮 */
drawerToggle.addEventListener('click', () => {
  if (drawer.classList.contains('open')) closeMobileDrawer();
  else openMobileDrawer();
});
scrim.addEventListener('click', closeMobileDrawer);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && isMobile() && drawer.classList.contains('open')) closeMobileDrawer();
});

/* 断点切换时清理/恢复各自的侧栏状态 */
let wasMobile = isMobile();
window.addEventListener('resize', () => {
  const nowMobile = isMobile();
  if (nowMobile === wasMobile) return;
  wasMobile = nowMobile;
  if (nowMobile) {
    // 进入移动端：抽屉默认关闭，折叠偏好保留在 localStorage
    drawer.classList.remove('open');
    scrim.classList.remove('show');
    document.body.dataset.drawer = 'closed';
    drawer.inert = true;
    document.body.dataset.sidebar = 'expanded';
    syncSidebarA11y();
  } else {
    // 回到桌面端：恢复折叠偏好
    drawer.classList.remove('open');
    scrim.classList.remove('show');
    document.body.dataset.drawer = 'closed';
    drawer.inert = false;
    setSidebarCollapsed(localStorage.getItem(SIDEBAR_KEY) === '1');
  }
}, { passive: true });

/* Masonry 重排：侧栏折叠动画结束、窗口缩放后调用 */
const mainEl = document.getElementById('main');
let lastMainWidth = mainEl.clientWidth;   // 只有宽度真的变化才重排，避免首屏多余计算
function relayoutGallery() {
  // Masonry 的列宽在实例创建时测量，宽度变化后仅 layout() 不会重新分列，需重建实例
  document.querySelectorAll('.grid').forEach((grid) => {
    const old = (window.Masonry && window.Masonry.data) ? window.Masonry.data(grid) : null;
    if (!old) return;
    old.destroy();
    new window.Masonry(grid, {
      itemSelector: '.gallery-item',
      columnWidth:  '.grid-sizer',
      gutter:       '.gutter-sizer',
      percentPosition: true,
    });
  });
}
let relayoutTimer = null;
function scheduleRelayout(delay = 150) {
  if (Math.abs(mainEl.clientWidth - lastMainWidth) < 2) return;
  lastMainWidth = mainEl.clientWidth;
  clearTimeout(relayoutTimer);
  relayoutTimer = setTimeout(relayoutGallery, delay);
}
drawer.addEventListener('transitionend', (e) => {
  if (e.propertyName === 'width' && !isMobile()) scheduleRelayout(0);
});
window.addEventListener('resize', () => scheduleRelayout(), { passive: true });
/* 主内容宽度变化（侧栏折叠、窗口缩放、字体/滚动条变化）都重新排版 */
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => scheduleRelayout()).observe(document.getElementById('main'));
}

/* 初始化 */
if (isMobile()) {
  document.body.dataset.drawer = 'closed';
  document.body.dataset.sidebar = 'expanded';
  drawer.inert = true;
} else {
  document.body.dataset.drawer = 'closed';
  drawer.inert = false;
  setSidebarCollapsed(localStorage.getItem(SIDEBAR_KEY) === '1');
}
syncSidebarA11y();

/* ── Detail Overlay ───────────────────────────────────────── */
const overlay   = document.getElementById('detailOverlay');
const detailImg = document.getElementById('detailImg');
const btnRaw    = document.getElementById('btnRaw');
let pendingLoad = null;
let currentPhoto = null;   // 当前详情页照片，供分享卡片取用

/* ── 分享卡片（独立模块，与「获取高清原图」互不影响） ───────── */
const shareCard = initShareCard({ getPhoto: () => currentPhoto });
document.getElementById('btnShare').addEventListener('click', () => shareCard.open());

function openDetail(p, thumbImg) {
  currentPhoto = p;
  document.getElementById('detailTitle').textContent   = p.title   || '无题';
  document.getElementById('detailLoc').textContent     = p.loc     || '';
  document.getElementById('detailDate').textContent    = p.date    || '';
  document.getElementById('detailComment').textContent = p.comment || '';
  document.getElementById('detailParams').innerHTML    = `
    <span class="param-key">相机</span><span class="param-val">${p.camera   || '-'}</span>
    <span class="param-key">参数</span><span class="param-val">${p.settings || '-'}</span>
  `;
  document.getElementById('detailTagRow').innerHTML =
    (p.tags || []).map(t => `<span class="detail-tag-chip">${t}</span>`).join('');
  btnRaw.href = p.raw || '#';
  detailImg.src = thumbImg.src;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  const key = thumbImg.src;
  pendingLoad = key;

  if (colorCache.has(key)) {
    applyTheme(...colorCache.get(key));
    return;
  }

  averageColorOf(thumbImg).then((color) => {
    if (!color) return;
    colorCache.set(key, color);
    if (pendingLoad === key) applyTheme(...color);
  }).catch(() => {});
}

const closeDetail = () => {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  pendingLoad = null;
  
  // 延迟 320ms（与 CSS 动画同步）后清空 src 防止残影
  setTimeout(() => {
    if (!overlay.classList.contains('open')) {
      detailImg.src = '';
    }
  }, 320);
};
document.getElementById('detailClose').onclick    = closeDetail;
document.getElementById('detailBackdrop').onclick = closeDetail;
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (shareCard.isOpen()) return;   // 分享弹窗打开时，ESC 只关分享弹窗
  closeDetail();
});

/* ── Init ─────────────────────────────────────────────────── */
buildNav();
renderGallery();
updatePageTitle();
</script>
