          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = '/';
          }
        });
      }

      // 2. 实时内联搜索逻辑
      var searchInput = document.getElementById('nf-search-input');
      var searchDropdown = document.getElementById('nf-search-dropdown');
      var searchData = null;
      var isFetching = false;

      function fetchSearchData() {
        if (searchData) return Promise.resolve(searchData);
        if (isFetching) return Promise.resolve(null);
        isFetching = true;
        
        var pathStr = CONFIG.search_path || 'local-search.xml';
        var cleanStr = pathStr.replace(/^https?:\/\/[^\/]+/, '').replace(/^\/+/, '');
        var rootStr = (CONFIG.root || '/').replace(/\/+$/, '') + '/';
        var finalSearchPath = window.location.origin + rootStr + cleanStr;

        return fetch(finalSearchPath)
          .then(res => res.text())
          .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
          .then(data => {
            searchData = Array.from(data.querySelectorAll('entry')).map(entry => {
              var titleNode = entry.querySelector('title');
              var urlNode = entry.querySelector('url');
              var contentNode = entry.querySelector('content');
              return {
                title: titleNode ? titleNode.textContent : '',
                url: urlNode ? urlNode.textContent : '',
                content: contentNode ? contentNode.textContent : ''
              };
            });
            isFetching = false;
            return searchData;
          }).catch(err => {
            isFetching = false;
            return [];
          });
      }

      function highlightText(text, keyword) {
        if (!text) return '';
        var regex = new RegExp(keyword, 'gi');
        return text.replace(regex, match => `<span class="nf-highlight">${match}</span>`);
      }

      function getSnippet(text, keyword) {
        if (!text) return '';
        var plainText = text.replace(/<[^>]+>/g, '');
        var index = plainText.toLowerCase().indexOf(keyword.toLowerCase());
        if (index === -1) return plainText.substring(0, 70) + '...';
        
        var start = Math.max(0, index - 25);
        var end = Math.min(plainText.length, index + keyword.length + 45);
        var snippet = plainText.substring(start, end);
        
        if (start > 0) snippet = '...' + snippet;
        if (end < plainText.length) snippet = snippet + '...';
        
        return highlightText(snippet, keyword);
      }

      function debounce(func, wait) {
        let timeout;
        return function(...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), wait);
        };
      }

      var handleSearch = debounce(function() {
        var query = searchInput.value.trim();
        if (!query) {
          searchDropdown.style.display = 'none';
          return;
        }

        searchDropdown.style.display = 'block';
        searchDropdown.innerHTML = `<div class="nf-search-empty">搜索中...</div>`;

        fetchSearchData().then(data => {
          if (!data || data.length === 0) {
            searchDropdown.innerHTML = `<div class="nf-search-empty">未获取到搜索数据或网络错误</div>`;
            return;
          }
          var keyword = query.toLowerCase();
          
          var results = data.filter(item => 
            item.title.toLowerCase().includes(keyword) || 
            item.content.toLowerCase().includes(keyword)
          );

          if (results.length > 0) {
            searchDropdown.innerHTML = results.slice(0, 6).map(item => {
              var link = (CONFIG.root || '/') + item.url.replace(/^\//, '');
              return `
                <a href="${link}" class="nf-search-result-item">
                  <div class="nf-search-title">${highlightText(item.title, query)}</div>
                  <div class="nf-search-content">${getSnippet(item.content, query)}</div>
                </a>
              `;
            }).join('');
          } else {
            searchDropdown.innerHTML = `<div class="nf-search-empty">未找到与 “${query}” 相关的文章</div>`;
          }
        });
      }, 250);

      if (searchInput) {
        searchInput.addEventListener('input', handleSearch);
        searchInput.addEventListener('focus', function() {
          if (this.value.trim()) handleSearch();
        });
      }

      document.addEventListener('click', function(e) {
        if (!e.target.closest('.nf-search-box') && searchDropdown) {
          searchDropdown.style.display = 'none';
        }
      });
    })();
  </script>

  <noscript>
    <div class="noscript-warning">博客在允许 JavaScript 运行的环境下浏览效果更佳</div>
  </noscript>
</body>
</html>
