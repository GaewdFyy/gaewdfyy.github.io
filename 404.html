<link rel="stylesheet" class="aplayer-secondary-style-marker" href="\assets\css\APlayer.min.css"><script src="\assets\js\APlayer.min.js" class="aplayer-secondary-script-marker"></script><script class="meting-secondary-script-marker" src="\assets\js\Meting.min.js"></script>
<style>
/* ========= 仅作用于 404 页：黑底 + VeroFess 光束 ========= */

/* 1. banner 换成纯黑底（去掉图片和遮罩） */
#banner.banner-404 {
  background-image: none !important;
  background-color: #1C1919 !important;
}
#banner .mask { display: none !important; }
/* banner 下沿与正文黑底无缝衔接 */
#banner::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -1px;
  height: 18vh;
  background: linear-gradient(180deg, rgba(28,25,25,0), #1C1919);
  pointer-events: none;
}

/* 2. VeroFess 光束：从 banner 顶端垂落 */
#banner .beam {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 3px;
  height: 72%;
  z-index: 1;
  background: linear-gradient(180deg, rgba(242,182,160,.9), rgba(242,182,160,0));
  filter: drop-shadow(0 0 7px rgba(242,160,120,.30));
  animation: beamBreath 4s ease-in-out infinite;
}
#banner .beam::after {
  content: "";
  position: absolute;
  bottom: -60px; left: 50%;
  transform: translateX(-50%);
  width: 150px; height: 150px;
  border-radius: 50%;
  filter: blur(10px);
  background: radial-gradient(circle, rgba(242,160,120,.30), transparent 70%);
}
@keyframes beamBreath { 0%,100%{opacity:.85} 50%{opacity:1} }

/* 3. 正文：黑底 + VeroFess 主体 */
body {
  background:
    radial-gradient(1.6px 1.6px at 20% 30%, rgba(242,182,160,.35), transparent 60%),
    radial-gradient(1.1px 1.1px at 40% 70%, rgba(242,182,160,.28), transparent 60%),
    radial-gradient(1.7px 1.7px at 65% 25%, rgba(242,182,160,.30), transparent 60%),
    radial-gradient(1.4px 1.4px at 10% 80%, rgba(242,182,160,.28), transparent 60%),
    #1C1919 !important;
}
main { padding-bottom: 0 !important; }

/* 404 大数字 */
.vf-code {
  font-size: clamp(90px, 20vw, 160px);
  font-weight: 800;
  letter-spacing: 6px;
  line-height: 1;
  text-align: center;
  margin-top: -8vh;             /* 往上靠，正对光束落点 */
  background: linear-gradient(180deg, #F5EDE9 15%, #F2B6A0 65%, #CC7B62 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 26px rgba(242,150,110,.22));
  animation: vfFloat 6s ease-in-out infinite;
}
@keyframes vfFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

/* 文案 */
.vf-slogan {
  margin-top: 22px;
  font-size: clamp(18px, 3vw, 24px);
  font-weight: 600;
  text-align: center;
  color: #EEE7E4;
}
.vf-desc {
  margin-top: 10px;
  max-width: 520px;
  margin-left: auto; margin-right: auto;
  font-size: 15px;
  line-height: 1.8;
  text-align: center;
  color: #AFA6A2;
}

/* 按钮 */
.vf-actions {
  margin-top: 30px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}
.vf-btn {
  padding: 12px 26px;
  border-radius: 999px;
  font-size: 15px;
  cursor: pointer;
  text-decoration: none;
  transition: .25s;
  border: 1px solid transparent;
  display: inline-block;
}
.vf-btn.primary {
  color: #1C1919;
  font-weight: 700;
  background: linear-gradient(135deg, #F2B6A0, #D97B5E);
  box-shadow: 0 0 20px rgba(242,150,110,.22), 0 6px 18px rgba(0,0,0,.35);
}
.vf-btn.primary:hover { background: linear-gradient(135deg, #FF9D84, #CC7B62); transform: translateY(-1px); }
.vf-btn.ghost {
  color: #F2B6A0;
  border-color: #F2B6A0;
  background: transparent;
}
.vf-btn.ghost:hover { background: #3A2D2D; color: #FF9D84; }
</style>

<div id="vf-404">
  <h1 class="vf-code">404</h1>
  <p class="vf-slogan">路途到此为止。</p>
  <p class="vf-desc">这里没有页面。循着光返回，或者选一条自己的路。</p>

  <div class="vf-actions">
    <a class="vf-btn primary" href="/">循光返回首页</a>
    <a class="vf-btn ghost" href="javascript:history.back()">返回上一页</a>
  </div>
</div>

<script>
/* 注入光束：插进主题 banner 里，顶端垂落 */
document.addEventListener('DOMContentLoaded', function () {
  var banner = document.getElementById('banner');
  if (banner && !banner.querySelector('.beam')) {
    var beam = document.createElement('div');
    beam.className = 'beam';
    banner.appendChild(beam);
  }
});
</script>
