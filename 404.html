  <!-- 404 hero interactions: back button + optional Cloudflare request info -->
  <script>
    (function () {
      var backBtn = document.querySelector('[data-action="nf-back"]');
      if (backBtn) {
        backBtn.addEventListener('click', function () {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = '/';
          }
        });
      }

      // Progressive enhancement: if this domain is proxied through Cloudflare,
      // /cdn-cgi/trace exposes the visitor's IP and country for the "request info" strip.
      // Fails silently (block stays hidden) on any other host.
      fetch('/cdn-cgi/trace', { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.text() : Promise.reject(); })
        .then(function (text) {
          var data = {};
          text.trim().split('\n').forEach(function (line) {
            var i = line.indexOf('=');
            if (i > -1) data[line.slice(0, i)] = line.slice(i + 1);
          });
          var meta = document.getElementById('nf-meta');
          var ipEl = document.getElementById('nf-meta-ip');
          var locEl = document.getElementById('nf-meta-loc');
          var found = false;
          if (data.ip) { ipEl.textContent = data.ip; found = true; }
          if (data.loc) { locEl.textContent = data.loc; found = true; }
          if (found) meta.removeAttribute('hidden');
        })
        .catch(function () { /* not on Cloudflare, or blocked — leave hidden */ });
    })();
  </script>
